# The lobby's NPCs. Edit in game with /npc (or here, then /npc reload).
# These are the built-in ones: the realm NPCs facing spawn, wearing skins from
# the lobby resource pack (players without the pack see the fallback skin).
# Their labels follow the realm: players online, restarting, maintenance,
# offline or coming soon (%lobby_status_REALM% / %lobby_action_REALM%).
# Delete this file to get them back.
