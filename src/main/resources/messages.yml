# ── "Are you sure?" ─────────────────────────────────────────────
# Asked before buying with Mystery Dust, taking cosmetics off and opening boxes.
confirm:
  title: "<brand><bold>Are you sure?</bold></brand>"
  accept:
    name: "<good>Confirm"
    lore:
      - "<accent><left-click></accent> <muted>to confirm"
  cancel:
    name: "<bad>Cancel"
    lore:
      - "<accent><left-click></accent> <muted>to go back"


# ── Network boosters ─────────────────────────────────────────
# Bought in the store (it runs /booster give <player> <game> <minutes> <multiplier>), kept in the player's
# booster inventory and used from My Profile → Boosters. <multiplier> <minutes> <game> <player>
boosters:
  title: "<brand><bold>Boosters</bold></brand>"
  # Each game's name and icon (an item model from the resource pack).
  games:
    ctf: "<secondary>Capture the Flag"
  icon:
    ctf: "fractal:ctf"
  item:
    name: "<gold><multiplier>x Coins Booster"
    lore:
      - "<muted>Game: <game>"
      - "<muted>Lasts: <white><minutes> minutes"
      - ""
      - "<muted>Everyone playing earns <gold><multiplier>x</gold>"
      - "<muted>coins, and sees it's from you."
      - ""
      - "<accent><left-click></accent> <muted>to activate"
  # In the "Are you sure?" menu. <ahead>: boosters running or waiting on that game before it
  confirm:
    name: "<gold>Activate <multiplier>x Coins Booster?"
    lore:
      - "<muted>Game: <game>"
      - "<muted>Lasts: <white><minutes> minutes"
      - ""
      - "<muted>It starts right away, or after the"
      - "<muted>boosters ahead of it (<white><ahead></white>)."
      - "<bad>It can't be stopped once it's on."
  empty:
    name: "<muted>No boosters yet"
    lore:
      - "<muted>Coin boosters from the store"
      - "<muted>show up here for you to use."
      - ""
      - "<muted>Get them at <accent>/store"
  info:
    name: "<primary>Running now"
    lore: []
    idle:
      - "<game><muted>: no booster"
    running:
      - "<game><muted>: <gold><multiplier>x <muted>by <aqua><player>"
      - "<muted><minutes> min left, <white><waiting></white> waiting"
  activated-now: "<prefix><good>Your <gold><multiplier>x Coins Booster</gold> is on for <game><good>! <muted>Everyone there gets <multiplier>x coins for <minutes> minutes."
  activated-queued: "<prefix><good>Your <gold><multiplier>x Coins Booster</gold> for <game> <good>is queued. <muted>It starts in about <wait> min, after the ones ahead of it."
  announce: "<prefix><aqua><player> <secondary>activated a <gold><multiplier>x Coins Booster</gold> <secondary>on <game><secondary>!"
  already-used: "<prefix><bad>That booster was already used."
  unavailable: "<prefix><bad>Boosters aren't available right now. <muted>Try again soon."
  # To whoever ran /booster give, and to the player if they're here.
  given: "<prefix><good>Gave <white><player></white> a <multiplier>x Coins Booster for <game> <good>(<minutes> min)."
  received: "<prefix><good>You got a <gold><multiplier>x Coins Booster</gold> <good>for <game><good>! <muted>Use it from <accent>My Profile → Boosters</accent>."


# ── Network levels (My Profile → Levels, /levels) ─────────────
# Icons (resource pack, font fractal:lobby): \uF024 Mystery Dust, \uF025 Mystery Box,
# \uF026 CTF coins, \uF027 network level.
levels:
  title: "<brand><bold>Levels</bold></brand> <dark_gray>(<from>-<to>)"
  # On joining the Lobby with rewards waiting (each line centred). <count>
  notify-one:
    - "<#6A5A8C><strikethrough>                                                  </strikethrough>"
    - "<#B266FF><bold>✦ NETWORK REWARDS ✦</bold>"
    - "<white>You have <#B266FF><bold>1</bold></#B266FF> unclaimed level reward!"
    - "<click:run_command:'/levels'><hover:show_text:'<#B266FF>Open your level rewards'><gold><bold>[ CLICK TO CLAIM ]</bold></gold></hover></click>"
    - "<#6A5A8C><strikethrough>                                                  </strikethrough>"
  notify-many:
    - "<#6A5A8C><strikethrough>                                                  </strikethrough>"
    - "<#B266FF><bold>✦ NETWORK REWARDS ✦</bold>"
    - "<white>You have <#B266FF><bold><count></bold></#B266FF> unclaimed level rewards!"
    - "<click:run_command:'/levels'><hover:show_text:'<#B266FF>Open your level rewards'><gold><bold>[ CLICK TO CLAIM ]</bold></gold></hover></click>"
    - "<#6A5A8C><strikethrough>                                                  </strikethrough>"
  head:
    name: "<white><font:fractal:lobby>\uF027</font> <#B266FF>Network Level <white><level>"
    lore:
      - "<muted>Progress to level <white><next></white>: <#6CE36C><percent>%"
      - "<bar>"
      - "<white><xp> <muted>/ <white><needed> XP <dark_gray>(<left> to go)"
      - ""
      - "<muted>Total XP: <white><total>"
      - "<muted>Coin multiplier: <white><font:fractal:lobby>\uF026</font> <gold><multiplier>x"
      - "<muted>Rewards to claim: <white><waiting>"
      - ""
      - "<muted>Earn XP playing <secondary>Survival</secondary> and <secondary>CTF</secondary>."
  # The beads leading to the next level. <level> <next> <bar> <percent> <xp> <needed> <left>
  bead:
    name: "<#6CE36C>Level <level> <dark_gray>➜</dark_gray> <#6CE36C><next>"
    lore:
      - "<bar> <#6CE36C><percent>%"
      - "<white><xp> <muted>/ <white><needed> XP <dark_gray>(<left> to go)"
  # Each level. <level> <dust> <coins> <xp> (to go) <stars> (the box it gave) <odds>
  rewards:
    - "<muted>Rewards:"
    - " <white><font:fractal:lobby>\uF024</font> <#FFD27F><dust></#FFD27F> <muted>Mystery Dust"
    - " <white><font:fractal:lobby>\uF026</font> <gold><coins></gold> <muted>CTF Coins"
  reward-box:
    - " <white><font:fractal:lobby>\uF025</font> <aqua>1 Mystery Box</aqua> <muted>with random stars:"
    - "    <odds>"
  reward-box-got:
    - " <white><font:fractal:lobby>\uF025</font> <aqua>1 Mystery Box</aqua> <muted>(you got <white><stars>★</white>)"
  node:
    start:
      name: "<good>Level 1"
      lore:
        - "<muted>Where everyone starts."
    claimed:
      name: "<good>✔ Level <level>"
      lore:
        - ""
        - "<good>Claimed"
    ready:
      name: "<gold>Level <level> <dark_gray>·</dark_gray> <good>Reward ready!"
      lore:
        - ""
        - "<accent><left-click></accent> <muted>to claim"
    locked:
      name: "<dark_gray>Level <level>"
      lore:
        - ""
        - "<bad>✖ <muted>Reach level <white><level></white> to claim"
        - "<dark_gray><xp> XP to go"
  multiplier:
    name: "<gold>Coin Multiplier: <yellow><multiplier>x"
    lore:
      - "<muted>Your network level multiplies"
      - "<muted>the CTF coins you earn."
      - ""
    step-reached: " <dark_gray>✔ Level <level>: <multiplier>x"
    step-current: " <good>▶ <white>Level <level>: <gold><multiplier>x <good>(you)"
    step-next: " <accent>▸ <muted>Level <white><level></white>: <gold><multiplier>x <muted>(next)"
    step: " <dark_gray>▪ Level <level>: <multiplier>x"
    footer:
      - ""
      - "<muted>Stacks with Network Boosters."
  claim-all:
    name: "<good>Claim All <white>(<count>)"
    lore:
      - "<muted>Every reward you've reached,"
      - "<muted>all at once."
      - ""
      - "<accent><left-click></accent> <muted>to claim"
  claim-none:
    name: "<muted>Nothing to claim"
    lore:
      - "<muted>Level up to unlock more rewards."
  next-box:
    name: "<aqua>Next Mystery Box: <white>Level <level>"
    lore:
      - "<muted><white><levels></white> level(s) to go <dark_gray>(<xp> XP)"
      - ""
      - "<muted>Every 5th level gives a Mystery Box."
      - "<muted>Its stars are picked when you claim:"
      - " <odds>"
  scroll-left:
    name: "<secondary>← Scroll back"
    lore:
      - "<muted>Towards level <white><from></white>."
  scroll-right:
    name: "<secondary>Scroll on →"
    lore:
      - "<muted>Towards level <white><to></white>."
  scroll-left-off:
    name: "<dark_gray>← Scroll back"
    lore:
      - "<dark_gray>You're at the start."
  scroll-right-off:
    name: "<dark_gray>Scroll on →"
    lore:
      - "<dark_gray>That's as far as it goes for now."
  recenter:
    name: "<#B266FF>Re-center"
    lore:
      - "<muted>Back to your level (<white><level></white>)."
      - ""
      - "<accent><left-click></accent> <muted>to jump there"
  # After claiming (lines). <count> <level> <dust> <coins> <boxes>
  claimed-one:
    - "<prefix><good>Level <white><level></white> reward claimed!"
    - "  <white><font:fractal:lobby>\uF024</font> <#FFD27F>+<dust></#FFD27F> <muted>Mystery Dust  <white><font:fractal:lobby>\uF026</font> <gold>+<coins></gold> <muted>CTF Coins"
  claimed-many:
    - "<prefix><good>Claimed <white><count></white> level rewards!"
    - "  <white><font:fractal:lobby>\uF024</font> <#FFD27F>+<dust></#FFD27F> <muted>Mystery Dust  <white><font:fractal:lobby>\uF026</font> <gold>+<coins></gold> <muted>CTF Coins"
  claimed-boxes: "  <white><font:fractal:lobby>\uF025</font> <aqua>Mystery Box: <white><boxes></white> <muted>(open it at the Mystery Vault)"
  claimed-footer: "  <dark_gray>CTF Coins arrive the next time you join CTF."
