glow:
  "on": "<prefix><secondary>You're now <primary>glowing</primary> in your rank colour."
  "off": "<prefix><secondary>You stopped glowing."

fly:
  "on": "<prefix><secondary>You can now <primary>fly</primary>. <muted>/fly to stop."
  "off": "<prefix><secondary>You stopped flying."
  parkour: "<prefix><bad>No flying during a parkour run."

spawn:
  teleported: "<prefix><secondary>Back to spawn."
  set: "<prefix><good>Spawn set to where you're standing."

general:
  players-only: "<prefix><bad>Only players can do that."
  unknown-command: "<prefix><bad>Unknown command. Try <white>/lobbycore reload</white>."
  reloaded: "<prefix><good>Reloaded config.yml, messages.yml and parkour.yml."

parkour:
  setup: "<prefix><good>The Parkour NPC is here now. <muted>Clicking it starts a run."
  leaderboard-set: "<prefix><good>Parkour leaderboard hologram placed here."
  leaderboard-removed: "<prefix><secondary>Parkour leaderboard hologram removed."
  leaderboard-moved: "<prefix><good>Parkour leaderboard hologram moved to where you're standing."
  area-set: "<prefix><good>Parkour <which> set. <muted>Area: <white><size></white> blocks."   # <which> <size>
  # The run itself. <score> <time> <best>
  game:
    start: "<prefix><secondary>Parkour started! <muted>Your best is <white><best></white>. Jump to the glowing block!"
    fell: "<prefix><secondary>You fell! <muted>Score <white><score></white> in <white><time></white>."
    idle: "<prefix><secondary>Run over: you stood still too long. <muted>Score <white><score></white>."
    left: "<prefix><secondary>Run over. <muted>Score <white><score></white>."
    new-best: "<prefix><good>New personal best: <white><score></white> jumps!"
    beating-best: "<good>You beat your best!"
    # Everyone sees this when someone takes first place. <player> <score>
    record: "<prefix><primary><player></primary> <secondary>set a new parkour record of <white><score></white> jumps!"
    no-area: "<prefix><bad>The parkour isn't set up yet. <muted>Staff: /lobbyparkour area pos1 and pos2."
    no-room: "<prefix><bad>There's no room for the parkour right now. Try again in a moment."
  # The sidebar while running (the lobby one comes back after). <score> <time> <best> <record>
  sidebar:
    title: "<brand><bold>Parkour</bold></brand>"
    lines:
      - ""
      - "<muted>Score: <white><score>"
      - "<muted>Time: <white><time>"
      - ""
      - "<muted>Your best: <primary><best>"
      - "<muted>Record: <accent><record>"
      - ""
      - "<#C9B8EE>Fall to end your run"
  # The leaderboard hologram (/lobbyparkour leaderboard).
  leaderboard:
    title: "<brand><bold>Parkour Leaderboard</bold></brand>"
    # One per best score (how many: parkour.hologram-top in config.yml). <position> <name> <score>
    # <name-rank> is the player's rank prefix (LuckPerms); the name takes its colour.
    top-line: "<muted>#<position> <white><name-rank><name> <dark_gray>- <primary><score>"
    no-scores: "<muted>No scores yet. Be the first!"
    # A place nobody has taken yet (the board always shows all of them). <position>
    empty-line: "<dark_gray>#<position> <#5E4A86>- - -"
    you: "<secondary>Your best: <primary><score> <muted>(<rank>)"   # <score> <rank>
    hint: "<accent><click></accent> <muted>to see the top 10"
  rank: "#<position>"
  unranked: "unranked"
  menu:
    title: "<brand><bold>Parkour Leaderboard</bold></brand>"
    entry-name: "<primary>#<position> <white><name-rank><name>"   # <position> <name-rank> <name> <score> <time>
    entry-lore:
      - "<muted>Best: <white><score> jumps"
      - "<muted>Time: <white><time>"
    entry-lore-you:
      - "<muted>Best: <white><score> jumps"
      - "<muted>Time: <white><time>"
      - ""
      - "<good>✔ That's you!"
    empty-name: "<dark_gray>#<position> ---"
    you-name: "<primary>Your stats"
    you-lore:   # <score> <rank>
      - "<muted>Best: <white><score> jumps"
      - "<muted>Rank: <white><rank>"
      - ""
      - "<dark_gray>Click the Parkour NPC to try again!"

