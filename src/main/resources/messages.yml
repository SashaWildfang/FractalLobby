# ┌──────────────────────────────────────────────────────────────┐
# │                       Lobby · messages                       │
# │       Built by Sasha Wildfang for Fractal Network.           │
# └──────────────────────────────────────────────────────────────┘
#
#  Text uses MiniMessage: https://docs.advntr.dev/minimessage/format
#  Leave a chat message empty ("") to turn it off.
#
#  Theme tags work everywhere in this file:
#    <primary> <secondary> <accent> <muted> <good> <bad>
#    <brand>text</brand>   - the theme gradient
#    <prefix>              - the prefix below
#
#  Resource packs can turn symbols into images. If a symbol shows up as
#  a picture, your pack uses it: replace it here.

# Do not change. When a plugin update ships new text, your old file is
# saved as messages.yml.old and replaced.
messages-version: 70

theme:
  primary: "#B266FF"
  secondary: "#E3C4FF"
  accent: "#FF7BE5"
  muted: "#9C8DB8"
  good: "#9BFFC4"
  bad: "#FF7590"
  gradient: ["#8E2DE2", "#E58BFF"]

prefix: "<brand><bold>Lobby</bold></brand> <dark_gray>»</dark_gray> "

format:
  # Font for everything players see: chat, the scoreboard, item names.
  #   small-caps - tiny text: "Lobby" shows as "ʟᴏʙʙʏ" (player names always stay normal)
  #   normal     - regular text
  # Write the text in this file normally; the plugin converts it as it's shown.
  font: small-caps


# ── Scoreboard ──────────────────────────────────────────────────
# Up to 15 lines, top to bottom. There are no numbers on the right.
# Tags you can use:
#   <online:NAME>  players on a proxy server (names from config.yml), e.g. <online:survival>
#   <online:all>   players on the whole network
#   <here>         players on this server
#   <player>       the viewer's name
#   <date> <time>  today's date and the time
# Start a line with <center> to center it on the scoreboard.
# PlaceholderAPI placeholders (%...%) also work when it's installed.
scoreboard:
  # \uF021 is the "LOBBY" logo from the resource pack (font fractal:lobby). Without the pack, use text
  # instead, e.g. "<brand><bold>FractalSMP</bold></brand>".
  title: "<white><!shadow><font:fractal:lobby>\uF021</font>"
  # The logo is taller than a line: the first line is left empty to make room for it.
  # Bedrock players don't get lines with <date> (Bedrock shows them too big under the logo).
  lines:
    - " "
    - "<center><gray><date>"
    - ""
    - "<secondary>You"
    - " <white><font:fractal:lobby>\uF024</font></white> <white>Dust: <#FFD27F>%lobby_dust%"
    - " <white><font:fractal:lobby>\uF025</font></white> <white>Boxes: <primary>%lobby_boxes%"
    - ""
    - "<secondary>Realms <muted>(<online:all>)"
    - " <primary>▪</primary> <white>Lobby: <primary><online:lobby>"
    - " <primary>▪</primary> <white>Survival: <primary><online:survival>"
    - ""
    - "<muted>web.fractalsmp.net"


# ── Tab list ────────────────────────────────────────────────────
# Above and below the player list. Same tags as the scoreboard.
# Player names in the list use nametag.format from config.yml.
tablist:
  # \uF020 is the FractalSMP logo from the resource pack; the empty lines above make room for it.
  header:
    - ""
    - ""
    - ""
    - "<white><!shadow><font:fractal:lobby>\uF020</font>"
    - "<secondary>fractalsmp.net"
    - "<gray>An experience like no other"
    - ""
  # <here> players in the lobby, <online:all> on the network, <ping> your ping, <tip> one of the tips below.
  footer:
    - ""
    - "<white><here></white> <muted>here <dark_gray>·</dark_gray> <white><online:all></white> <muted>online <dark_gray>·</dark_gray> <white><ping></white><muted>ms"
    # \uF022 and \uF023 are the store and Discord icons from the resource pack. The tab list can't
    # be clicked, so it names the commands, which send clickable links (from Core on the proxy).
    - "<white><!shadow><font:fractal:lobby>\uF022</font></white> <accent>/store</accent>   <white><!shadow><font:fractal:lobby>\uF023</font></white> <#7FA8FF>/discord"
    - ""
    - "<tip>"
    - ""
  # One shows at a time under the links, changing every tablist.tip-seconds (config.yml).
  # A long tip is split over two lines automatically (or put <br> where you want the break).
  tips:
    - "<white>Tip:</white> <muted><white>/radio</white> plays music while you hang out"
    - "<white>Tip:</white> <muted>Right-click your head for your profile"
    - "<white>Tip:</white> <muted>Pick a realm with the globe in your hotbar"
    - "<white>Tip:</white> <muted>Lost? <white>/spawn</white> takes you back"
    - "<white>Tip:</white> <muted>Try the parkour course for a spot on the leaderboard"
    - "<white>Tip:</white> <muted>Set a status, chat colour and trail in your profile"
    - "<white>Tip:</white> <muted>Get ranks and perks with <accent>/store"
    - "<white>Tip:</white> <muted>Join the community with <#7FA8FF>/discord"


# ── Realm selector ──────────────────────────────────────────────
# Each realm's name, item and description are in config.yml (realm-selector).
realm-selector:
  title: "<brand><bold>Realms</bold></brand>"
  # Added under every realm's description (kept up to date while the menu is open).
  # <status> <players> <action> <online> <max> <realm> <server>
  button-lore:
    - ""
    - "<muted>Status: <status>"
    - "<muted>Playing: <players>"
    - ""
    - "<action>"
  # Under a realm's description while a network booster runs on it (the realm's server name is the booster's game).
  # <multiplier> <player> <minutes>
  booster:
    - ""
    - "<gray>Coins Multiplier: <gold>+<multiplier>x"
    - "<dark_gray>➠ <gray>Network Booster by <aqua><player>"
  players: "<white><online>"                                   # max players unknown
  players-max: "<white><online><dark_gray>/<gray><max>"
  status:
    online: "<good>● Online"
    full: "<#FFE680>● Full"
    maintenance: "<#FFB36B>● Maintenance"
    offline: "<bad>● Offline"
  action:
    online: "<accent><click></accent> <muted>to join"
    full: "<dark_gray>✖ <muted>Full right now, try again soon"
    maintenance: "<dark_gray>✖ <muted>Being worked on, back soon"
    offline: "<dark_gray>✖ <muted>Down right now, back soon"
  connecting: "<prefix><secondary>Sending you to <realm><secondary>…"
  # A realm marked coming-soon in config.yml.
  coming-soon: "<prefix><realm> <secondary>is coming soon! <muted>Keep an eye on <keep:'/discord'>."
  # When a realm can't be joined. <realm> <server>
  offline: "<prefix><bad>Can't join <realm><bad>: it's offline right now. <muted>Try again soon!"
  maintenance: "<prefix><#FFB36B><realm> <#FFB36B>is down for maintenance. <muted>Check back soon!"
  full: "<prefix><#FFE680><realm> <#FFE680>is full right now. <muted>Try again in a bit!"


# ── Join items ──────────────────────────────────────────────────
items:
  realm-selector:
    name: "<primary>Realm Selector"
    lore:
      - "<muted>Pick a realm to play on: Survival,"
      - "<muted>Prison or Capture the Flag."
      - ""
      - "<muted>See who's playing and which"
      - "<muted>realms are online right now."
      - ""
      - "<accent><right-click></accent> <muted>to open"
  radio:
    name: "<primary>Radio"
    lore:
      - "<muted>Pick songs, skip, change the volume"
      - "<muted>or tune in to the lobby station."
      - ""
      - "<accent><right-click></accent> <muted>to open"
  visibility-shown:
    name: "<good>Players: Visible"
    lore:
      - "<muted>You can see everyone in the lobby."
      - ""
      - "<accent><right-click></accent> <muted>to hide other players"
  # Player Visibility set to Donors Only or Staff Only in settings. <option>
  visibility-partial:
    name: "<#FFE680>Players: <option>"
    lore:
      - "<muted>You only see some players."
      - ""
      - "<accent><right-click></accent> <muted>to hide everyone"
  visibility-hidden:
    name: "<bad>Players: Hidden"
    lore:
      - "<muted>Other players are hidden from you."
      - ""
      - "<accent><right-click></accent> <muted>to show other players"
  profile:
    name: "<primary>My Profile"
    lore:
      - "<muted>Your stats, chat colour, trail,"
      - "<muted>glow and settings."
      - ""
      - "<accent><right-click></accent> <muted>to open"
  settings:
    name: "<primary>Settings"
    lore:
      - "<muted>Choose whose join and leave"
      - "<muted>messages, chat and players you"
      - "<muted>see, plus mention sounds, double"
      - "<muted>jump and the scoreboard."
      - ""
      - "<accent><right-click></accent> <muted>to open"

# The settings menu (the comparator). Each setting lists its options with
# the current one marked; clicking moves to the next one.
settings:
  title: "<brand><bold>Settings</bold></brand>"
  # The option names. Donors Only includes staff.
  options:
    everyone: "<good>Everyone"
    donors: "<#FFE680>Donors Only"
    staff: "<#FFB36B>Staff Only"
    nobody: "<bad>Nobody"
    "on": "<good>On"
    "off": "<bad>Off"
  option: "<dark_gray>  <gray><option>"   # each option that isn't picked
  option-selected: "<primary>▸ <option>"    # the picked one
  current: "<white>Now: <option>"          # on the switch under each setting
  hint:
    - "<accent><left-click></accent> <muted>for the next option"
    - "<accent><right-click></accent> <muted>to go back"
  toggle-hint:
    - "<accent><left-click></accent> <muted>to switch"
  # Under each setting's options: the switch below it is what to click.
  switch-below:
    - "<muted>Use the switch below to change it."
  lobby-section:
    name: "<primary>Lobby <dark_gray>→"
    lore:
      - "<muted>Only in the lobby."
  network-section:
    name: "<primary>Network <dark_gray>→"
    lore:
      - "<muted>Everywhere on the network."
  network-unavailable:
    name: "<bad>Network settings unavailable"
    lore:
      - "<muted>The proxy isn't answering."
      - "<muted>Try again in a moment."
  reset:
    name: "<bad>Reset Lobby Settings"
    lore:
      - "<muted>Puts every lobby setting"
      - "<muted>back to its default."
      - ""
      - "<accent><shift><left-click></accent> <muted>to reset"
    done: "<prefix><secondary>Your lobby settings are back to their defaults."
  join-messages:
    name: "<primary>Join Messages"
    lore:
      - "<muted>Whose join messages you see."
  leave-messages:
    name: "<primary>Leave Messages"
    lore:
      - "<muted>Whose leave messages you see."
  chat:
    name: "<primary>Chat"
    lore:
      - "<muted>Whose chat messages you see."
      - "<muted>Your own always show."
  player-visibility:
    name: "<primary>Player Visibility"
    lore:
      - "<muted>Which players you can see"
      - "<muted>walking around the lobby."
  mentions:
    name: "<primary>Mention Sounds"
    lore:
      - "<muted>A ping when someone says"
      - "<muted>your name in chat."
  double-jump:
    name: "<primary>Double Jump"
    lore:
      - "<muted>Press jump in the air to"
      - "<muted>launch yourself forward."
  scoreboard:
    name: "<primary>Scoreboard"
    lore:
      - "<muted>The realm player counts"
      - "<muted>on the right of your screen."
  # Network settings, kept by Core on the proxy (they show when Core is installed).
  private-messages:
    name: "<primary>Private Messages"
    lore:
      - "<muted>Whether players can /msg you."
      - "<muted>Staff can always reach you."
  message-sounds:
    name: "<primary>Message Sounds"
    lore:
      - "<muted>A ping when a private"
      - "<muted>message arrives."
  friend-requests:
    name: "<primary>Friend Requests"
    lore:
      - "<muted>Whether players can send"
      - "<muted>you friend requests."
  friend-notify:
    name: "<primary>Friend Alerts"
    lore:
      - "<muted>A message when a friend"
      - "<muted>joins or leaves the network."
  party-invites:
    name: "<primary>Party Invites"
    lore:
      - "<muted>Whether players can invite"
      - "<muted>you to their party."
  social-spy:
    name: "<primary>Social Spy"
    lore:
      - "<muted>See private messages"
      - "<muted>between other players."
      - "<dark_gray>Staff only"
  command-spy:
    name: "<primary>Command Spy"
    lore:
      - "<muted>See the commands"
      - "<muted>other players type."
      - "<dark_gray>Staff only"
  vanish:
    name: "<primary>Vanish"
    lore:
      - "<muted>Hidden from /glist, /find"
      - "<muted>and players in the lobby."
      - "<dark_gray>Staff only"
  ignored:
    name: "<primary>Ignored Players"
    lore:
      - "<muted>Players whose chat and"
      - "<muted>messages you never see."
    count: "<white>Ignoring: <accent><count>"
    entry: "<dark_gray>  <gray><player>"
    more: "<dark_gray>  …and <count> more"
    none:
      - "<dark_gray>  Nobody yet. Use <gray>/ignore <name>"
    hint:
      - "<accent><left-click></accent> <muted>to manage"
  ignored-menu:
    title: "<brand><bold>Ignored Players</bold></brand>"
    head:
      name: "<primary><player>"
      lore:
        - "<accent><left-click></accent> <muted>to unignore"
    empty:
      name: "<good>You're not ignoring anyone"
      lore:
        - "<muted>Type <white>/ignore <name></white> <muted>in chat"
        - "<muted>to hide someone."
    more:
      name: "<gray>…and <count> more"
      lore:
        - "<muted>Use <white>/ignorelist</white> <muted>in chat."
    back:
      name: "<secondary>← Back"
      lore:
        - "<muted>Back to your friends."
    removed: "<prefix><secondary>You unignored <primary><player></primary>."


# ── Chat ────────────────────────────────────────────────────────
visibility:
  shown: "<prefix><secondary>Other players are now <good>visible</good>."
  hidden: "<prefix><secondary>Other players are now <bad>hidden</bad>."
  cooldown: "<prefix><muted>Slow down a little."

# Shown above the hotbar when a player is saved from the void.
out-of-bounds: "<secondary>That's the edge of the lobby! <muted>Back to spawn."
void-rescued: "<secondary>Whoosh! <muted>Flying you back to solid ground."

# Punching staff (players with lobby.punch). <puncher> <target> <seconds>
punch:
  immune: "<bad><target> <bad>can't be punched."   # <target>
  announce: "<prefix><accent><puncher></accent> <secondary>punched <primary><target></primary> <secondary>into the sky!"
  you-punched: "<prefix><secondary>You punched <primary><target></primary> <secondary>into the sky!"
  punched: "<prefix><accent><puncher></accent> <secondary>punched you into the sky!"
  cooldown: "<muted>You can punch again in <white><seconds>s"

# The network playtime leaderboard hologram (/lobbyplaytime). Times come from Core on the proxy.
playtime:
  placed: "<prefix><good>Playtime leaderboard hologram placed here."
  moved: "<prefix><good>Playtime leaderboard hologram moved to where you're standing."
  removed: "<prefix><secondary>Playtime leaderboard hologram removed."
  hologram:
    title: "<brand><bold>Top Playtime</bold></brand>"
    # One per player (how many: playtime.hologram-top in config.yml). <position> <name-rank> <name> <time>
    top-line: "<muted>#<position> <white><name-rank><name> <dark_gray>- <primary><time>"
    empty: "<muted>Loading…"
    you: "<secondary>Your playtime: <primary><time>"   # <time>

# Friends (from Core on the proxy): the green FRIEND badge in friends' join and
# leave messages (join-messages in config.yml), and the friends menu (profile).
friends:
  tag: "<white>\uE2A1</white>"
  menu:
    title: "<brand><bold>Friends</bold></brand>"
    # An online friend. <player> <server> <since>
    online:
      name: "<#5BE37C><player>"
      lore:
        - "<#5BE37C>● <white>Online <muted>on <white><server>"
        - "<muted>Friends for <white><since>"
        - ""
        - "<accent><left-click></accent> <muted>to join them"
        - "<accent><shift> <right-click></accent> <muted>to remove"
    # A friend who's offline. <player> <since>
    offline:
      name: "<gray><player>"
      lore:
        - "<dark_gray>● <gray>Offline"
        - "<muted>Friends for <white><since>"
        - ""
        - "<accent><shift> <right-click></accent> <muted>to remove"
    empty:
      name: "<secondary>No friends yet"
      lore:
        - "<muted>Type <white>/f add [name]</white> <muted>in chat"
        - "<muted>to send someone a request."
    more:
      name: "<gray>…and <count> more"
      lore:
        - "<muted>See them all with <white>/f list"
    # The buttons along the bottom
    add:
      name: "<primary>Add a Friend"
      lore:
        - "<muted>Type <white>/f add [name]</white> <muted>in chat."
        - "<muted>They get a request to accept."
    requests:
      name: "<primary>Friend Requests"
      lore:
        - "<muted>See requests waiting"
        - "<muted>for an answer."
        - ""
        - "<accent><left-click></accent> <muted>to list them in chat"
    # The "Are you sure?" before removing a friend (their head). <player>
    remove-confirm:
      name: "<bad>Remove <white><player></white>?"
      lore:
        - "<muted>They'll be taken off your"
        - "<muted>friends list (and you off theirs)."
    removed: "<prefix><secondary>You removed <primary><player></primary> <secondary>from your friends."
    no-core: "<prefix><bad>Friends aren't available right now."
  # The Friends button in the profile. <online> <count>; <status> is one of the two below
  button:
    none-online: "<bad>None"
    some-online: "<#5BE37C><online></#5BE37C> <dark_gray>/ <white><count>"
    name: "<primary>Friends"
    lore:
      - "<muted>Your friends across"
      - "<muted>the network."
      - ""
      - "<white>Online: <status>"
      - ""
      - "<accent><left-click></accent> <muted>to open"

# The profile menu (the player's head in the hotbar).
# The head shows: <player> <rank> <joined> <playtime> <parkour-best> <parkour-rank> <chat-color> <trail> <glow>
profile:
  title: "<brand><bold>My Profile</bold></brand>"
  no-rank: "<gray>Member"
  default: "<gray>Default"
  none: "<gray>None"
  locked: "<prefix><bad>You haven't unlocked that yet."
  head:
    name: "<primary><player>"
    lore:
      - "<muted>Rank: <rank>"
      - "<muted>First joined: <white><joined>"
      - "<muted>Playtime: <white><playtime>"
      - ""
      - "<network>"
      - "<coin-multiplier-line>"
      - "<muted>Parkour best: <white><parkour-best> <muted>(<parkour-rank>)"
    # The <network> and <coin-multiplier-line> lines: network level and the CTF coin multiplier it gives. <level> <multiplier>
    network: "<muted>Network Level: <white><font:fractal:lobby>\uF027</font> <#B266FF><level>"
    coin-multiplier: "<muted>Coin Multiplier: <white><font:fractal:lobby>\uF026</font> <gold><multiplier>x"
  status:
    name: "<primary>Status"
    lore:
      - "<muted>Shown under your name."
      - "<muted>Now: <status>"
      - ""
      - "<accent><left-click></accent> <muted>to change"
  chat-color:
    name: "<primary>Chat Colour"
    lore:
      - "<muted>The colour your messages are in."
      - "<muted>Now: <chat-color>"
      - ""
      - "<accent><left-click></accent> <muted>to change"
  trail:
    name: "<primary>Particle Trail"
    lore:
      - "<muted>Particles that follow you around."
      - "<muted>Now: <trail>"
      - ""
      - "<accent><left-click></accent> <muted>to change"
  glow:
    name: "<primary>Glow"
    lore:
      - "<muted>Glow in your rank colour."
      - "<muted>Now: <glow>"
      - ""
      - "<accent><left-click></accent> <muted>to switch"
  glow-locked:
    name: "<dark_gray>Glow"
    lore:
      - "<muted>Glow in your rank colour."
      - ""
      - "<bad>✖ Locked"
      - "<muted>Guardian rank or higher."
  settings:
    name: "<primary>Settings"
    lore:
      - "<muted>Join and leave messages, chat,"
      - "<muted>player visibility, mention sounds,"
      - "<muted>double jump and the scoreboard."
      - ""
      - "<accent><left-click></accent> <muted>to open"
  # Network level: XP from playing Survival and Capture the Flag (not while AFK). <level> <next> <bar> <percent> <xp> <needed> <total>
  level:
    name: "<#B266FF>Network Level <white><level>"
    lore:
      - "<muted>Level up by playing on the network."
      - ""
      - "<muted>Progress to level <white><next></white>: <#B266FF><percent>%"
      - "<bar>"
      - "<white><xp> <muted>/ <white><needed> XP"
      - ""
      - "<muted>Earn XP while you play <secondary>Survival</secondary>"
      - "<muted>and <secondary>Capture the Flag</secondary>."
      - ""
      - "<accent><left-click></accent> <muted>for levels and rewards"
  # Network boosters the player owns. <count>
  boosters:
    name: "<primary>Boosters"
    lore:
      - "<muted>Coin boosters for everyone on a"
      - "<muted>game, bought in the store."
      - ""
      - "<muted>You have: <white><count>"
      - ""
      - "<accent><left-click></accent> <muted>to see them"
  parkour:
    name: "<primary>Parkour"
    lore:
      - "<muted>Your best: <white><parkour-best> <muted>(<parkour-rank>)"
      - ""
      - "<accent><left-click></accent> <muted>for the leaderboard"
  realms:
    name: "<primary>Realms"
    lore:
      - "<muted>Pick a realm to play on."
      - ""
      - "<accent><left-click></accent> <muted>to open"
  back:
    name: "<secondary>← Back"
    lore:
      - "<muted>Back to your profile."

# The status menu (from the profile). Statuses are listed in config.yml.
status:
  title: "<brand><bold>Status</bold></brand>"
  # Under the player's name. <status> = the emoji and the status's name
  below-name: "<muted>Status: <status>"
  set: "<prefix><secondary>Your status is now <status><secondary>."
  cleared: "<prefix><secondary>Status cleared."
  locked: "<prefix><bad>You haven't unlocked that status."
  # Under each status in the menu. <preview> = how it looks under your name
  item:
    - "<preview>"
    - ""
    - "<accent><left-click></accent> <muted>to use"
  item-selected:
    - "<preview>"
    - ""
    - "<good>✔ Selected</good> <muted>· <accent><left-click></accent> <muted>to clear"
  item-locked:
    - "<preview>"
    - ""
    - "<bad>✖ Locked"
  clear-item:
    name: "<bad>Clear Status"
    lore:
      - "<muted>Show nothing under your name."

# Shown under a player's name instead of their status after afk.minutes idle (config.yml). <icon> = the pack's clock
afk:
  below-name: "<icon> <#FF5A5A><bold>AFK</bold>"
  # In place of the rank above the head and in the tab list while AFK (\uE2A0 = the pack's light red AFK badge)
  tag: "<white>\uE2A0</white> "
  # Only the player sees these: "on" after /afk, "off" whenever they come back (moving, chatting, /afk...)
  "on": "<prefix><secondary>You're now <#FF7590>AFK</#FF7590>. <muted>Move or type <white>/afk</white> to come back."
  "off": "<prefix><secondary>Welcome back! You're no longer AFK."

# The particle trail menu (from the profile). Trails are listed in config.yml.
trails:
  title: "<brand><bold>Particle Trails</bold></brand>"
  set: "<prefix><secondary>Your trail is now <trail><secondary>."   # <trail>
