# ┌──────────────────────────────────────────────────────────────┐
# │                            Lobby                             │
# │  Scoreboard, tab list, chat, protection, spawn and items.    │
# │       Built by Sasha Wildfang for Fractal Network.           │
# └──────────────────────────────────────────────────────────────┘
#
#  Text in this file and messages.yml can use:
#    - & colour codes: &7 grey, &l bold, &#B266FF hex
#    - MiniMessage tags: <gray>, <bold>, <#B266FF>, plus the theme tags
#      <primary> <secondary> <accent> <muted> <good> <bad> and <brand>text</brand>
#    - %player%, %luckperms_prefix% / %luckperms_suffix% (LuckPerms), and
#      any PlaceholderAPI placeholder when PlaceholderAPI is installed
#  The font (tiny "small caps" or normal) is set in messages.yml (format.font).
#  Apply changes with /lobby reload.

# Do not change. Used to upgrade this file in future versions.
config-version: 2


# ── Spawn ───────────────────────────────────────────────────────
# Set it in-game with /setspawn (saves your position here).
spawn:
  world: "world"
  x: -221.515
  y: 3.0
  z: 238.56
  yaw: -90.8
  pitch: 1.3
  # Send players to spawn every time they join.
  teleport-on-join: true
  # Put everyone in Adventure mode when they join (staff can switch back
  # with /gamemode).
  adventure-on-join: true


# ── Protection ──────────────────────────────────────────────────
# Protects every world on this server (no WorldGuard needed), so an
# imported hub is safe straight away. true = blocked.
protection:
  # Players with this permission skip the player rules below
  # (building, using blocks and entities, items, projectiles).
  build-permission: "lobby.build"
  # Operators count as builders, even without the permission.
  allow-ops-to-build: true

  # -- What players can do --
  # Placing and breaking blocks, buckets, signs, paintings, item frames,
  # armor stands, boats, minecarts, bone meal, flint and steel.
  disable-building: true
  # Using blocks: chests and other containers, doors, trapdoors, gates,
  # buttons, levers, beds, anvils, crafting tables, note blocks...
  disable-block-interact: true
  # Blocks players may still use when the above is on. Use * as a
  # wildcard, e.g. ["*_DOOR", "*_BUTTON", "LECTERN"].
  allow-interact: []
  # Item frames, armor stands, mobs (trading, feeding, mounting), leads.
  # Players can still ride flying minecarts.
  disable-entity-interact: true
  # Farmland, turtle eggs and sniffer eggs never get trampled.
  disable-trampling: true
  # Picking up items from the ground.
  disable-item-pickup: true
  # Bows, snowballs, eggs, ender pearls, tridents, fishing rods.
  disable-projectiles: true
  # Players hurting each other.
  disable-pvp: true
  # Players hurting mobs and other entities (incl. with arrows).
  disable-mob-attacks: true

  # -- Players' health --
  # Players never take damage (fire, drowning, cactus, explosions...).
  # The void is handled by void-rescue, and /kill still works.
  disable-damage: true
  # Only fall damage (used when disable-damage is false).
  disable-fall-damage: true
  # Hunger never goes down.
  disable-hunger: true
  # Players walk through each other instead of pushing.
  disable-player-collision: true

  # -- The world --
  # Explosions don't break blocks, item frames or armor stands.
  disable-explosions: true
  # Fire doesn't spread or burn blocks; lava and lightning don't start it.
  disable-fire-spread: true
  # No mobs spawn by themselves (spawn eggs, commands and plugins
  # like NPCs still work).
  disable-mob-spawning: true
  # Blocks never change on their own: no leaf decay, melting, snow or
  # ice forming, grass/vines spreading, crops growing, farmland drying,
  # endermen taking blocks, or sand and gravel falling.
  freeze-blocks: true
  # Water and lava don't flow.
  disable-liquid-flow: false
  # It never rains or storms.
  disable-weather: true
  # Lock the time of day: 1000 = morning, 6000 = noon, 13000 = night,
  # 18000 = midnight. -1 = normal day and night (turning it back to -1
  # needs /gamerule doDaylightCycle true once).
  lock-time: -1


# ── Void rescue ─────────────────────────────────────────────────
# Falling off the map lifts players back up and flies them to the last
# block they stood on, with a particle trail. With none yet, to spawn.
void-rescue:
  enabled: true
  # Players are rescued once they fall below this height.
  below-y: -25
  # Sound when rescued (a sound name, or "" for none).
  sound: entity.player.teleport
  sound-volume: 0.6
  sound-pitch: 1.4


# ── World border ────────────────────────────────────────────────
# Sets the spawn world's world border to a square around the spawn
# point (it moves with /setspawn). Turning it off removes it again
# (then /lobby reload or a restart).
border:
  enabled: true
  # Blocks from spawn to each edge (100 = a 200 x 200 square).
  radius: 318
  # The screen tints red this many blocks from the border (0 = never).
  warning-distance: 5


# ── Flying minecarts ────────────────────────────────────────────
# /flyingminecart summons a minecart anyone can ride.
# Riding: W flies where you look, S brakes, Space climbs,
# sprint goes faster, sneak gets out.
flying-minecarts:
  # Top speed in blocks per tick (1.0 = 20 blocks a second).
  speed: 1.0
  # Empty minecarts vanish after this many seconds.
  despawn-after-seconds: 30
  # Two ridden minecarts that crash into each other explode
  # (just looks and sound: no damage, riders are thrown out).
  explode-on-collision: true


# ── Launch pads ─────────────────────────────────────────────────
# Stepping on this block launches players the way they're facing.
# Place them anywhere; every one of this block in the lobby is a pad.
launch-pads:
  enabled: true
  block: STONE_PRESSURE_PLATE
  # Push forward and up. Higher = further / higher.
  forward: 2.4
  upward: 1.0
  sound: entity.firework_rocket.launch
  sound-volume: 0.8
  sound-pitch: 1.2


# ── Join, quit and first-join messages ──────────────────────────
# Leave a message empty ("") to turn it off. %luckperms_prefix% is the
# player's rank; the name takes the rank's colour.
join-messages:
  first-join: "&7ᴡᴇʟᴄᴏᴍᴇ %luckperms_prefix%&c%player% &7ᴛᴏ ᴛʜᴇ ꜱᴇʀᴠᴇʀ!"
  join-message: "&a+ &7%luckperms_prefix%%player%"
  quit-message: "&c- &7%luckperms_prefix%%player%"
  # What a player's friends see instead (friends come from Core on the proxy):
  # %lobby_friend_tag% is the green FRIEND badge. "" = friends see the normal one.
  friend-join-message: "&a+ %lobby_friend_tag% &a%player%"
  friend-quit-message: "&c- %lobby_friend_tag% &a%player%"
  # Sounds everyone hears when a staff member or donor joins or leaves
  # (who counts as which: see ranks below). "" for no sound.
  sounds:
    volume: 0.6
    staff:
      join: block.beacon.activate
      leave: block.beacon.deactivate
    donor:
      join: entity.player.levelup
      leave: block.note_block.bass


# ── Ranks ───────────────────────────────────────────────────────
# Who counts as a donor and as staff, for settings like "Donors Only"
# and the join sounds. Give these permissions to your LuckPerms groups.
# Staff also count as donors.
ranks:
  donor-permission: lobby.donor
  staff-permission: lobby.staff


# ── Mentions ────────────────────────────────────────────────────
# Saying someone's name in chat plays a sound for them (each player can
# turn it off in settings). Writing @Name also highlights it in their chat.
mentions:
  enabled: true
  sound: block.note_block.pling
  volume: 1.0
  pitch: 1.4
  # How @Name looks to the player mentioned (MiniMessage).
  highlight: "<#FFD27F><bold>"


# ── Double jump ─────────────────────────────────────────────────
# Press jump in mid-air to launch forward. Needs lobby.doublejump (everyone
# by default); each player can turn it off in settings. Off in creative,
# in vehicles and during a parkour run.
double-jump:
  enabled: true
  # Push forward and up. Higher = further / higher.
  forward: 1.3
  upward: 0.9
  sound: entity.breeze.jump
  sound-volume: 0.6
  sound-pitch: 1.2


# ── Chat ────────────────────────────────────────────────────────
# Players with a LuckPerms prefix use ranked-format, everyone else
# default-format. %message% is what they typed (never recoloured).
chat:
  enabled: true
  default-format: "&7%player%: %message%"
  ranked-format: "%luckperms_prefix%%player%&f: %message%"


# ── Parkour ─────────────────────────────────────────────────────
# Infinite parkour, built into the lobby: click the Parkour NPC (or
# type /parkour) and blocks appear in the air one jump ahead, inside the
# parkour area. The next block sparkles, with a dotted arc showing the
# jump. Falling ends the run. Scores are kept in parkour-scores.yml (the
# first time, ajParkour's scores are brought over).
#   /lobbyparkour setup              the Parkour NPC (starts runs) here
#   /lobbyparkour area pos1 / pos2   the two corners of the area the
#                                    course is built in (the first time,
#                                    they're taken from ajParkour)
#   /lobbyparkour area return        where players go after a run
#   /lobbyparkour leaderboard        the leaderboard hologram here
parkour:
  # How many places the leaderboard hologram lists (0-10); places nobody
  # has taken yet show as empty.
  hologram-top: 10
  # How far down the leaderboard to look for a player's rank.
  rank-search: 100
  # Blocks the course is made of (a random one each jump).
  blocks:
    - PURPLE_CONCRETE
    - MAGENTA_CONCRETE
    - PINK_CONCRETE
    - PURPLE_WOOL
    - MAGENTA_WOOL
  # A run ends after this long without reaching a new block.
  idle-seconds: 30
  # How the next jump is shown to the runner: "pack" = a dotted line to the
  # next block and a ghost of the block after (needs FractalLobby.zip),
  # "particles" = sparkles and a dotted line of particles (no pack needed).
  guide: pack
  # Jump lengths (centre to centre, 2-5 blocks) get longer as the score
  # goes up: easy until medium-from, then medium, hard, expert.
  jumps:
    medium-from: 5
    hard-from: 25
    expert-from: 50
    easy-min: 2
    easy-max: 2
    medium-min: 3
    medium-max: 3
    hard-min: 3
    hard-max: 4
    expert-min: 4
    expert-max: 5


# ── Playtime leaderboard ────────────────────────────────────────
# /lobbyplaytime          puts a hologram of the longest network
#                          playtimes where you stand
# /lobbyplaytime move     moves it to exactly where you stand
# /lobbyplaytime remove   takes it away
# The times come from Core on the proxy (Core 1.2.0 or newer).
playtime:
  # How many players the hologram lists (1-20).
  hologram-top: 10


# ── Punching ────────────────────────────────────────────────────
# Players with lobby.punch can punch staff to launch them into the sky
# (it never hurts). Staff with lobby.punch.immune can't be punched.
punch:
  enabled: true
  # Only staff can be punched (false: anyone).
  staff-only: true
  # Seconds before the same player can punch again.
  cooldown-seconds: 10
  # How hard: up, and away from the puncher.
  upward: 1.6
  backward: 0.8
  sound: entity.generic.explode
  # Tell everyone in chat (false: only the two players).
  announce: true


# ── AFK ─────────────────────────────────────────────────────────
# After this many minutes without moving, looking around, chatting or
# clicking, a red "AFK" shows under the player's name in place of their
# status. Nothing is said in chat; any activity takes it away.
afk:
  enabled: true
  minutes: 5


