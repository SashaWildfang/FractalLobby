      particle: HEART
      item: RED_DYE
      amount: 1
      permission: lobby.trail.donor
    snowflakes:
      name: "<#E8F6FF>Snowflakes"
      particle: SNOWFLAKE
      item: SNOWBALL
      amount: 3
      permission: lobby.trail.donor
    flames:
      name: "<#FFB36B>Flames"
      particle: FLAME
      item: BLAZE_POWDER
      amount: 2
      speed: 0.01
      permission: lobby.trail.donor
    soul-flames:
      name: "<#7FE7FF>Soul Flames"
      particle: SOUL_FIRE_FLAME
      item: SOUL_TORCH
      amount: 2
      speed: 0.01
