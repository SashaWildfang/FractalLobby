# ── Nametags ────────────────────────────────────────────────────
# Shown above players' heads. The colour code right before %player%
# colours the name itself.
nametag:
  enabled: true
  format: "%luckperms_prefix%%player%"
  # Use the same format for names in the tab list.
  apply-to-tablist: true


# ── Network player counts ───────────────────────────────────────
# Asks the proxy (Velocity or BungeeCord) how many players are on each
# server. Works with no proxy plugin: Velocity relays these requests as
# long as "bungee-plugin-message-channel" is true in velocity.toml
# (it is by default). Counts need at least one player in the lobby.
proxy:
  enabled: true
  # How often to ask for new counts, in seconds (0.25 at the fastest).
  # Joins and leaves on this server show straight away.
  refresh-seconds: 1
  # Server names exactly as they are in the proxy config. Use them as
  # <online:survival>; <online:all> is the whole network.
  servers:
    - lobby
    - survival
    - prison
    - ctf


# ── Scoreboard and tab list ─────────────────────────────────────
# The text is in messages.yml (scoreboard and tablist).
scoreboard:
  enabled: true
  # How often the scoreboard and tab list redraw, in ticks (20 = 1 second).
  # Only lines that actually changed are sent.
  update-ticks: 10
  # Format of <date>, see https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/time/format/DateTimeFormatter.html
  # MM/dd/yyyy = 11/15/2026.
  date-format: "MM/dd/yyyy"
  # Time zone for <date> and <time>, e.g. America/New_York. Empty = the server's.
  time-zone: ""
  # Leave out any line that counts a realm (<online:NAME>) while that realm
  # is offline or in maintenance. Uses the realm selector's status checks.
  hide-offline-realms: true

tablist:
  enabled: true
  # How often the tip at the bottom of the tab list changes (tips are in messages.yml).
  tip-seconds: 12
  # Higher LuckPerms ranks (group weight) are listed first.
  sort-by-rank: true


# ── Join items ──────────────────────────────────────────────────
join-items:
  # Clear the inventory on join, then give the join items.
  clear-inventory: true
  # Only players with lobby.staff can move, drop or swap items.
  lock-inventory: true
  # No crafting: the 2x2 grid in the inventory takes no items and the
  # recipe book stays empty and closed (the resource pack hides both).
  no-crafting: true
  # Nobody can put items in their off hand (staff included).
  block-off-hand: true

  # Opens the realm selector.
  realm-selector:
    enabled: true
    # Hotbar slot, 1 to 9.
    slot: 1
    item: COMPASS

  # Opens the Radio menu (from the Radio plugin).
  radio:
    enabled: true
    slot: 5
    item: JUKEBOX
    # Command run when it's right-clicked, without the /.
    command: radio
    # Only give the item when this plugin is installed ("" = always).
    requires-plugin: Radio

  # The player's own head: opens their profile (stats, chat colour,
  # trail, glow, settings).
  profile:
    enabled: true
    slot: 2

  # Opens the settings menu: join messages, leave messages, chat and
  # the scoreboard, each on or off per player. Remembered between joins.
  settings:
    enabled: true
    slot: 8
    item: COMPARATOR

  # Toggles whether you can see other players. Remembered between joins.
  player-visibility:
    enabled: true
    slot: 9
    item-visible: LIME_DYE
    item-hidden: GRAY_DYE
    # Seconds between uses, to stop spam clicking.
    cooldown-seconds: 1.5


# ── Menus ───────────────────────────────────────────────────────
menus:
  # Draw the settings, chat colour, trails and parkour menus with the
  # resource pack's backgrounds and icons (needs FractalLobby.zip, like
  # realm-selector.custom-gui). false = black panes and normal items.
  custom-gui: true


# ── Realm selector ──────────────────────────────────────────────
# The menu the compass opens. Clicking a realm sends the player to its
# server through the proxy. Menu title and button text are in messages.yml.
realm-selector:
  # Menu height in rows (1-6).
  rows: 3
  # Lay out the realms a player can see centred on the middle row, so one
  # realm sits in the middle and they close up when one is hidden. false =
  # each realm stays in its own slot below.
  auto-center: true
  # Draw the menu with a custom background in the style of Survival's
  # menus (title plaque, slate panel, a square behind each realm) instead
  # of black panes.
  # Needs FractalLobby.zip in the server resource pack (with Nexo: put it
  # in plugins/Nexo/pack/external_packs). false = black panes, no pack needed.
  custom-gui: true
  # Each realm shows Online, Full, Maintenance or Offline. Lobby pings
  # each realm at the address the proxy has for it (or "address" below).
  # Offline and full realms can't be joined; lobby.bypass.full and
  # lobby.bypass.maintenance let staff in anyway.
  status:
    enabled: true
    refresh-seconds: 3
    # A realm whose MOTD or version text has one of these is shown as
    # under maintenance (works with most maintenance plugins).
    maintenance-words: ["maintenance"]
    # Leave offline realms out of the menu, and realms under maintenance
    # too (except for players with lobby.bypass.maintenance). A realm only
    # shows once it's been checked, so one that's down never flashes up
    # (a realm the proxy doesn't know, with no "address", never shows).
    hide-down-realms: true
    # A realm that goes down within this many seconds of being up shows as
    # "restarting" on holograms and NPC labels (%lobby_status_REALM%).
    restart-seconds: 180
  realms:
    survival:
      # Server name in the proxy config.
      server: survival
      # Menu slot, counting from 0 at the top left (9 per row).
      slot: 11
      item: GRASS_BLOCK
      # Optional: the icon from the resource pack instead ("" = the item above).
      item-model: "fractal:survival"
      name: "<primary><bold>Survival"
      description:
        - "<muted>Classic survival with friends."
        - ""
        - "<white>▪ <gray>Claim land and build your base"
        - "<white>▪ <gray>Trade and team up with others"
        - "<white>▪ <gray>Explore a shared world"
      # Optional: "host:port" to ping instead of the proxy's address.
      address: ""
      # Optional: true shows it as under maintenance, whatever the ping says.
      maintenance: false
    prison:
      server: prison
      # Holograms and NPC labels show it as coming soon (set false when it opens).
      coming-soon: true
      slot: 13
      item: IRON_BARS
      name: "<accent><bold>Prison"
      description:
        - "<muted>Mine your way to the top."
        - ""
        - "<white>▪ <gray>Mine, sell and rank up"
        - "<white>▪ <gray>Unlock new mines as you climb"
        - "<white>▪ <gray>Prestige and break out"
    ctf:
      server: ctf
      # Holograms and NPC labels show it as coming soon (set false when it opens).
      coming-soon: true
      slot: 15
      item: RED_BANNER
      name: "<secondary><bold>Capture the Flag"
      description:
        - "<muted>Team up and steal the flag."
        - ""
        - "<white>▪ <gray>Two teams, one flag each"
        - "<white>▪ <gray>Grab theirs and bring it home"
        - "<white>▪ <gray>Defend yours at all costs"


# ── Mystery Boxes ───────────────────────────────────────────────
# Boxes of 1 to 5 stars that give a random cosmetic (a trail, a chat colour,
# glowing) or a pile of Mystery Dust. A cosmetic the player already has turns
# into Mystery Dust, and dust crafts new boxes. Boxes are opened at the
# Mystery Vault (stand on its spot and type /mysterybox vault set); without a
# vault they open in front of the player.
#   /mysterybox                         the Mystery Vault menu (everyone)
#   /dust                               your Mystery Dust (everyone)
#   /mysterybox give NAME STARS [AMOUNT] give boxes (console: store, votes)
#   /mysterybox dust NAME AMOUNT        give (or take, negative) Mystery Dust
#   /mysterybox reset NAME              take everything away
#   /mysterybox vault set / remove      place or remove the vault
# Found cosmetics work without the rank permission (they're saved in
# mystery-boxes.yml).
mystery-boxes:
  enabled: true
  # A box every day a player joins (the day goes by scoreboard.time-zone);
  # every streak-days days in a row, a bigger one.
  daily:
    enabled: true
    stars: 1
    streak-days: 7
    streak-stars: 3
  # A box for a new parkour personal best (once a day, from this score up).
  parkour-best:
    enabled: true
    min-score: 10
    stars: 1
  # Mystery Dust it costs to craft a box, by stars.
  craft-cost:
    1: 150
    2: 300
    3: 600
    4: 1200
    5: 2500
  # The chance (in %) of each rarity for a box, by stars:
  # [common, rare, epic, legendary]
  odds:
    1: [70, 25, 5, 0]
    2: [50, 35, 13, 2]
    3: [30, 40, 24, 6]
    4: [10, 40, 38, 12]
    5: [0, 25, 50, 25]
  # Each rarity's name and colour, and the Mystery Dust a duplicate turns into.
  rarities:
    common:
      name: "<#C9B8EE>Common"
      color: "#C9B8EE"
      duplicate-dust: 10
    rare:
      name: "<#7FA8FF>Rare"
      color: "#7FA8FF"
      duplicate-dust: 25
    epic:
      name: "<#C77DFF>Epic"
      color: "#C77DFF"
      duplicate-dust: 60
    legendary:
      name: "<#FFD27F>Legendary"
      color: "#FFD27F"
      duplicate-dust: 150
  # Everyone is told when someone finds something this rare or rarer.
  announce: legendary
  # What boxes can give: "type:value rarity". Types: trail:ID and
  # chatcolor:ID (from trails and chat-color above), glow, dust:AMOUNT.
  # Cosmetics that are free for everyone are left out automatically.
  rewards:
    - "dust:20 common"
    - "dust:35 common"
    - "trail:hearts common"
    - "trail:snowflakes common"
    - "trail:sparks common"
    - "dust:60 rare"
    - "trail:flames rare"
    - "trail:blossom rare"
    - "trail:magic rare"
    - "chatcolor:ocean rare"
    - "dust:140 epic"
    - "trail:soul-flames epic"
    - "trail:stars epic"
    - "chatcolor:sunset epic"
    - "chatcolor:fractal epic"
    - "glow epic"
    - "dust:350 legendary"
    - "trail:enchanted legendary"
    - "trail:totem legendary"
    - "chatcolor:rainbow legendary"
