name: Lobby
version: '${version}'
main: com.sasha.lobby.Lobby
api-version: '1.21.11'
description: '${description}'
authors: [Sasha Wildfang]
softdepend: [PlaceholderAPI, LuckPerms]

# Commands are registered in code through Paper's command API (see LobbyCommand).

permissions:
  lobby.*:
    description: Every Lobby permission (give it in LuckPerms; nobody has it by default)
    default: false
    children:
      lobby.staff: true
      lobby.donor: true
      lobby.punch: true
      lobby.punch.immune: true
      lobby.trail.donor: true
      lobby.doublejump: true
      lobby.bypass.maintenance: true
      lobby.bypass.full: true
      lobby.admin: true
      lobby.build: true
      lobby.spawn: true
      lobby.cmd.glow: true
      lobby.cmd.afk: true
      lobby.cmd.chatcolor: true
      lobby.chatcolor.gradients: true
      lobby.chatcolor.rainbow: true
      lobby.cmd.flyingminecart: true
  lobby.staff:
    description: Counts as staff (settings, join sounds) and can move and drop items in the lobby
    default: op
  lobby.donor:
    description: Counts as a donor (settings like Donors Only, join sounds)
    default: op
  lobby.punch:
    description: Punch staff to launch them into the sky
    default: op
  lobby.punch.immune:
    description: Can't be punched
    default: false
  lobby.trail.donor:
    description: Use the donor particle trails (set per trail in config.yml)
    default: op
  lobby.doublejump:
    description: Double jump in the lobby
    default: true
  lobby.bypass.maintenance:
    description: Join realms that are under maintenance from the realm selector
    default: op
  lobby.bypass.full:
    description: Join full realms from the realm selector
    default: op
  lobby.admin:
    description: Administer Lobby, parkour and set the spawn
    default: op
  lobby.build:
    description: Place and break blocks in the lobby (name set by protection.build-permission)
    default: false
  lobby.spawn:
    description: Use /spawn
    default: true
  lobby.cmd.afk:
    description: Use /afk to show (or stop showing) that you're AFK
    default: true
  lobby.cmd.glow:
    description: Use /glow to glow in your rank colour
    default: op
  lobby.cmd.chatcolor:
    description: Use /chatcolor to pick a chat colour
    default: true
  lobby.chatcolor.gradients:
    description: Use the gradient chat colours (set per colour in config.yml)
    default: op
  lobby.chatcolor.rainbow:
    description: Use the rainbow chat colour
    default: op
  lobby.cmd.flyingminecart:
    description: Use /flyingminecart to summon a flying minecart (and break them)
    default: op
